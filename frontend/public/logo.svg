<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="df-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="df-grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="df-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <rect width="100" height="100" rx="24" fill="#0f172a" />
  
  <g filter="url(#df-shadow)">
    <!-- 360 Ring Flow -->
    <circle cx="50" cy="50" r="32" stroke="url(#df-grad1)" stroke-width="8" stroke-dasharray="140 60" stroke-linecap="round" transform="rotate(-45 50 50)" />
    <!-- Dynamic Inner Arrow/Flow -->
    <path d="M40 34 L62 50 L40 66 L48 50 Z" fill="url(#df-grad2)" />
    <circle cx="62" cy="50" r="4" fill="#ffffff" />
  </g>
</svg>
